<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>English Quiz</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="card">

      <h1 class="center">
        English Quiz ❤️
      </h1>

      <div id="quiz-screen">

        <div class="progress-wrap">

          <div class="progress-info">
            <span>Całość</span>
            <span id="overall-progress-text">
              0 / 0
            </span>
          </div>

          <div class="progress-bar">
            <div
              id="overall-progress"
              class="progress"
            ></div>
          </div>

        </div>


        <div class="progress-wrap">

          <div class="progress-info">
            <span id="segment-text">
              Segment 1
            </span>

            <span
              id="segment-progress-text"
            >
              0 / 50
            </span>
          </div>

          <div class="progress-bar">
            <div
              id="segment-progress"
              class="progress"
            ></div>
          </div>

        </div>


        <div class="center">

          <p>
            Seria:
            <strong id="streak">
              🔥 0
            </strong>
          </p>

        </div>


        <div
          id="question"
          class="question"
        >
          Ładowanie...
        </div>


        <div
          id="answers"
          class="answers"
        ></div>

      </div>



      <div
        id="break-screen"
        class="hidden center"
      >

        <h2>
          Chwila przerwy ☕
        </h2>

        <p
          id="break-message"
          style="font-size: 20px;"
        >
          Super Ci idzie ❤️
        </p>

        <div
          id="break-timer"
          class="break-timer"
        >
          01:00
        </div>

        <button
          id="continue-btn"
          class="main-btn"
        >
          Jestem gotowa — lecimy dalej
        </button>

      </div>



      <div
        id="final-screen"
        class="hidden center"
      >

        <h2>
          Koniec 🎉
        </h2>

        <p
          style="
            font-size: 18px;
            margin-bottom: 5px;
          "
        >
          Twój wynik:
        </p>

        <div
          id="final-score"
          style="
            font-size: 42px;
            font-weight: bold;
          "
        >
          0 / 0
        </div>

        <p
          id="final-message"
          style="
            font-size: 20px;
            margin-top: 20px;
          "
        >
          Jestem z Ciebie dumny ❤️
        </p>

      </div>

    </div>

  </div>


  <script src="words.js"></script>
  <script src="app.js"></script>

</body>
</html>
